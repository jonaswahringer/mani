[package]
name = "mani"
version = "0.1.0"
edition = "2024"
description = "Custom guides beside authoritative local command documentation"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
pulldown-cmark = "0.12"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
unicode-width = "0.2"
wait-timeout = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3.15"

[profile.release]
lto = true
strip = true
